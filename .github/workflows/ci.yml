
name: Track 4 CI

# Each track repo's root IS the public folder, so all paths below are root-relative.
on:
  push:
    branches: [main, "task/**", "track4/**"]
  pull_request:
    branches: [main]

jobs:
  # Run standard-library validation and lightweight harness tests first.
  # These checks do not require the shared competition toolkit.
  firewall:
    name: Firewall (stdlib only, no secret — runs on forks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install pytest (no token required)
        run: |
          python -m pip install --upgrade pip
          pip install "pytest==9.1.1"

      - name: Card, track, split and canary checks
        run: python .github/validate_units.py analysis --stdlib-only

      # Only run tests that do not import qfbench2_common here.
      # The strong RAG baseline tests run in the toolkit-backed job.
      - name: Harness-contract tests (stdlib only)
        run: python -m pytest baselines/tests/test_harness_argv.py -q

  lint-type:
    name: Lint + type check (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      # The toolkit is installed from the PUBLIC toolkit repository, so this
      # workflow needs no secret and runs on fork pull requests.
      #
      # Pin a TAG, never a branch. The contract set this repo consumes is 1.1.0.
      #
      # The contract surfaces this repo consumes, and which the pinned
      # toolkit must carry:
      #   * C1 1.2.0 fixtures and closed target-type vocabulary
      #   * C4 registry 1.1.0 FailureCode.DOMAIN_GATE_FAILED
      #   * qfbench2_common.smoke.resolve_verifier_factory
      #   * faithfulness.EMBARGO_REASONS / ISO_DATE_RE
      #   * py.typed for strict type checks
      #
      # Move all three install lines together when upgrading the toolkit.

      - name: Install tools + shared toolkit
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.4.7" "mypy==1.10.0"
          pip install "pytest==9.1.1"
          pip install "qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.5.1#subdirectory=common"

      - name: Ruff lint
        run: ruff check scoring faithfulness qfbench2_track_analysis

      - name: Ruff format check
        run: ruff format --check scoring faithfulness qfbench2_track_analysis

      - name: Mypy (strict)
        run: mypy --strict --ignore-missing-imports scoring faithfulness qfbench2_track_analysis

  # Run scorer, judge, and baseline tests in an environment that has the
  # shared toolkit installed.
  #
  # This is necessary because the strong RAG baseline imports
  # qfbench2_track_analysis.numeric, which imports qfbench2_common.
  #
  # The original stdlib-only firewall job does not install that dependency.
  tests:
    name: Tests (scorer + judge, toolkit-backed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install pytest, transformers + shared toolkit
        run: |
          python -m pip install --upgrade pip

          # Transformers is required by the judge package.
          # No PyTorch installation is required for these unit tests.
          pip install "pytest==9.1.1" "transformers==5.15.0" "setuptools==84.0.0"

          # Keep the published shared toolkit pinned.
          pip install "qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.5.1#subdirectory=common"

      # Use the published hub revision for scorer documentation tests.
      - name: Check out the published hub (starter packs)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Agenthon-2026/Agenthon2026-public
          ref: 50fb2dc2b39c70f4cf81fcd269943782eddfaed0
          path: hub-checkout

      - name: Scorer + judge tests
        env:
          QFBENCH2_HUB_ROOT: ${{ github.workspace }}/hub-checkout
        run: python -m pytest scoring/tests faithfulness/tests tests baselines/guardrails_example/tests -q

      # Run the previously failing baseline tests AFTER toolkit installation.
      # This tests the real strong RAG agent without requiring a model endpoint.
      - name: Strong RAG baseline tests
        run: python -m pytest baselines/strong_rag_baseline/tests -q

  # Manifest checksums and public-safety verification require the toolkit.
  # Keep these checks separate from the stdlib-only firewall.
  validate-units:
    name: Validate units (+ manifests · public-safety)
    needs: firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install shared toolkit
        run: |
          python -m pip install --upgrade pip
          pip install "qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.5.1#subdirectory=common"

      - name: Validate all public units
        run: python .github/validate_units.py analysis
