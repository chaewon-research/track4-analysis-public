
name: Publish Agenthon V8

on:
  push:
    branches:
      - agenthon-v8-reliability
    paths:
      - .github/workflows/publish-agenthon-v8.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Version 8
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Version 8
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agenthon
          platforms: linux/amd64
          push: true
          tags: ghcr.io/chaewon-research/agenthon-track4:v8-response-recovery
